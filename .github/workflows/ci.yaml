name: Checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/pixel_art_mcp
      - run: uv run --frozen pytest -m 'not blender and not e2e'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: docker compose up --build --wait --wait-timeout 120
      - run: uv run --frozen pytest -m e2e
        env:
          PIXEL_E2E_URL: http://localhost:8000
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
