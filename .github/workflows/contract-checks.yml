name: Contract Checks

# Consumer-driven contract check against pixel-index's real staging/production APIs
# (issue #8): does the shape of the zips this repo generates still match what those
# environments accept? No commit is vendored or pinned -- each run asks the live
# environment which commit it's running and validates against that directly. See
# docs/contract-testing.md and contracts/pixel_index/.

on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/pixel_index/**"
      - "src/pixel_art_mcp/models.py"
      - "src/pixel_art_mcp/imaging/pixel_agents.py"
      - "src/pixel_art_mcp/imaging/character.py"
      - "src/pixel_art_mcp/imaging/pet.py"
      - ".github/workflows/contract-checks.yml"

permissions:
  contents: read

concurrency:
  group: contract-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contract:
    name: Verify pixel-index (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            base_url: https://pixel-index-api.nntin.xyz
          - name: staging
            base_url: https://pixel-index-api-staging.nntin.xyz
          # Add more environments here as they come online.

    steps:
      - name: Initialize contract result
        env:
          ENVIRONMENT_NAME: ${{ matrix.name }}
          BASE_URL: ${{ matrix.base_url }}
          RESULT_PATH: ${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json
        run: |
          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            --arg environment "$ENVIRONMENT_NAME" \
            --arg base_url "$BASE_URL" \
            '{
              schema_version: 1,
              environment: $environment,
              base_url: $base_url,
              status: "unknown",
              checked_at: null,
              counts: {pass: 0, fail: 0, skipped: 0},
              checks: [],
              detail: "The contract check did not complete. Inspect the workflow run for an infrastructure or setup failure."
            }' > "$RESULT_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r contracts/pixel_index/requirements.txt

      - name: Run contract check
        # checks.py imports pixel_art_mcp.imaging.{pixel_agents,pet} to build fixtures
        # the same way the real exporters do -- see contracts/pixel_index/requirements.txt
        # for why that's importable from just pillow+pydantic, no full app install needed.
        env:
          PYTHONPATH: src
        run: |
          python -m contracts.pixel_index.verify \
            --base-url "${{ matrix.base_url }}" \
            --env-name "${{ matrix.name }}" \
            --output-json "${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json"

      - name: Upload contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-index-contract-result-${{ matrix.name }}
          path: ${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  build-status-site:
    name: Build current status site
    needs: verify-contract
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download contract results
        uses: actions/download-artifact@v5
        with:
          pattern: pixel-index-contract-result-*
          path: ${{ runner.temp }}/pixel-index-contract-results
          merge-multiple: true

      - name: Generate status site
        env:
          RESULTS_DIR: ${{ runner.temp }}/pixel-index-contract-results
          OUTPUT_DIR: ${{ runner.temp }}/contract-site
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m contracts.pixel_index.generate_status_site \
            --results-dir "$RESULTS_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --repository "${{ github.repository }}" \
            --branch "$DEFAULT_BRANCH" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --event "${{ github.event_name }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/contract-site

  deploy-status-site:
    name: Deploy current status site
    needs: build-status-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
