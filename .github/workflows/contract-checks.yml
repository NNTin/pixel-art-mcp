name: Contract Checks

# Consumer-driven contract check against pixel-index's real staging/production APIs
# (issue #8): does the shape of the zips this repo generates still match what those
# environments accept? No commit is vendored or pinned -- each run asks the live
# environment which commit it's running and validates against that directly. See
# docs/contract-testing.md and contracts/pixel_index/.
#
# This workflow also owns the repo's one GitHub Pages deployment, so the example asset
# gallery (issue #15: every example in examples/asset-specs.json goes through the real MCP
# rendering pipeline) is built and published here too, alongside the contract dashboard, in
# a single combined deploy -- two independent Pages deploys would each overwrite the other's
# content. See docs/game-assets.md#reproduce-examples-and-webview-checks.
#
# On a pull request touching a path below, the same gallery is also generated and pushed to
# a Vercel preview deployment (not GitHub Pages -- that stays default-branch-only) with the
# URL posted as a PR comment, so a rendering-affecting change can be visually reviewed before
# merge instead of only after it lands on develop.

on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      bypass_default_branch_check:
        description: >-
          Run the examples gallery, build the status site, and deploy it to GitHub Pages
          from this branch even though it isn't the default branch.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "contracts/pixel_index/**"
      - "examples/**"
      - "scripts/generate_examples.py"
      - "src/pixel_art_mcp/models.py"
      - "src/pixel_art_mcp/imaging/pixel_agents.py"
      - "src/pixel_art_mcp/imaging/character.py"
      - "src/pixel_art_mcp/imaging/pet.py"
      - ".github/workflows/contract-checks.yml"

permissions:
  contents: read

concurrency:
  group: contract-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-contract:
    name: Verify pixel-index (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production
            base_url: https://pixel-index-api.nntin.xyz
          - name: staging
            base_url: https://pixel-index-api-staging.nntin.xyz
          # Add more environments here as they come online.

    steps:
      - name: Initialize contract result
        env:
          ENVIRONMENT_NAME: ${{ matrix.name }}
          BASE_URL: ${{ matrix.base_url }}
          RESULT_PATH: ${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json
        run: |
          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            --arg environment "$ENVIRONMENT_NAME" \
            --arg base_url "$BASE_URL" \
            '{
              schema_version: 1,
              environment: $environment,
              base_url: $base_url,
              status: "unknown",
              checked_at: null,
              counts: {pass: 0, fail: 0, skipped: 0},
              checks: [],
              detail: "The contract check did not complete. Inspect the workflow run for an infrastructure or setup failure."
            }' > "$RESULT_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r contracts/pixel_index/requirements.txt

      - name: Run contract check
        # checks.py imports pixel_art_mcp.imaging.{pixel_agents,pet} to build fixtures
        # the same way the real exporters do -- see contracts/pixel_index/requirements.txt
        # for why that's importable from just pillow+pydantic, no full app install needed.
        env:
          PYTHONPATH: src
        run: |
          python -m contracts.pixel_index.verify \
            --base-url "${{ matrix.base_url }}" \
            --env-name "${{ matrix.name }}" \
            --output-json "${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json"

      - name: Upload contract result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-index-contract-result-${{ matrix.name }}
          path: ${{ runner.temp }}/pixel-index-contract-results/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  generate-examples-gallery:
    name: Generate example asset gallery
    # All examples in examples/asset-specs.json (NNTin/pixel-art-mcp#15): a real MCP client
    # authors/renders/downloads every one of them through the Dockerized service, the same
    # pipeline docs/game-assets.md documents for local development.
    if: ${{ github.ref_name == github.event.repository.default_branch || inputs.bypass_default_branch_check == true || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.12"

      - run: uv sync --frozen

      - run: docker compose up --build --wait --wait-timeout 120

      - name: Generate every example through MCP
        run: |
          uv run --frozen python scripts/generate_examples.py \
            --base-url http://localhost:8000 \
            --output "${{ runner.temp }}/examples-gallery"

      - if: always()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down

      - name: Upload example gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: examples-gallery
          path: ${{ runner.temp }}/examples-gallery
          if-no-files-found: error
          retention-days: 1

  build-status-site:
    name: Build current status site
    needs: [verify-contract, generate-examples-gallery]
    if: ${{ always() && (github.ref_name == github.event.repository.default_branch || inputs.bypass_default_branch_check == true) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download contract results
        uses: actions/download-artifact@v5
        with:
          pattern: pixel-index-contract-result-*
          path: ${{ runner.temp }}/pixel-index-contract-results
          merge-multiple: true

      # A failed gallery generation still lets the contract dashboard deploy, just without
      # an updated `examples/` section, rather than resurrecting a stale one or blocking
      # the whole site on it -- the failure is itself visible in the Actions run. Downloaded
      # before generate_status_site.py runs so it can link to examples/index.html when present.
      - name: Download example gallery
        if: ${{ needs.generate-examples-gallery.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: examples-gallery
          path: ${{ runner.temp }}/contract-site/examples

      - name: Generate status site
        env:
          RESULTS_DIR: ${{ runner.temp }}/pixel-index-contract-results
          OUTPUT_DIR: ${{ runner.temp }}/contract-site
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m contracts.pixel_index.generate_status_site \
            --results-dir "$RESULTS_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --repository "${{ github.repository }}" \
            --branch "$DEFAULT_BRANCH" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --event "${{ github.event_name }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/contract-site

  deploy-status-site:
    name: Deploy current status site
    needs: build-status-site
    if: ${{ github.ref_name == github.event.repository.default_branch || inputs.bypass_default_branch_check == true }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview-gallery:
    name: Deploy example gallery preview (Vercel)
    needs: generate-examples-gallery
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download example gallery
        uses: actions/download-artifact@v5
        with:
          name: examples-gallery
          path: ${{ runner.temp }}/examples-gallery

      # The linked Vercel project auto-detected this repo's root as FastAPI; a per-deploy
      # vercel.json overrides that and forces a plain static deploy of the artifact's files.
      - name: Force static deploy
        run: |
          echo '{"framework": null}' > "${{ runner.temp }}/examples-gallery/vercel.json"

      - name: Install Vercel CLI
        run: npm install -g vercel@54.4.1

      - name: Deploy preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy "${{ runner.temp }}/examples-gallery" --token="$VERCEL_TOKEN" --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Example gallery preview for ${{ github.sha }}: ${{ steps.deploy.outputs.url }}"
